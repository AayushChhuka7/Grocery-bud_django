databases:
  - name: my-django-db
    plan: free # or starter

services:
  - type: web
    name: my-django-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn my_project_name.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-django-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "my-django-app.onrender.com"
