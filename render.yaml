databases:
  - name: my-django-db
    plan: free # or starter

services:
  - type: web
    name: my-django-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
   startCommand: "gunicorn grocery.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-django-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "my-django-app.onrender.com"
